# USB/OpenCV 相机发布配置。使用 /dev/v4l/by-path 固定物理 USB 端口，避免 /dev/videoN
# 随插拔改变。启用后由 cell.launch.py 包含 data_collection 的 opencv_cameras.launch.py。
opencv_cameras:
  - name: usb_front
    enabled: true
    device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:6.2.1:1.0-video-index0
    topic: /camera/usb_front/color/image_raw
    frame_id: usb_front_color_optical_frame
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
    publish_compressed: true
    compressed_quality: 90

  - name: usb_left
    enabled: true
    device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:6.2.2:1.0-video-index0
    topic: /camera/usb_left/color/image_raw
    frame_id: usb_left_color_optical_frame
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
    publish_compressed: true
    compressed_quality: 90

  - name: usb_right
    enabled: true
    device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:6.3.2:1.0-video-index0
    topic: /camera/usb_right/color/image_raw
    frame_id: usb_right_color_optical_frame
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
    publish_compressed: true
    compressed_quality: 90
