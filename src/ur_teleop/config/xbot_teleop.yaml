# XBot 专用配置：不继承 ur_teleop.yaml。
# 修改本文件即可完成 XBot 的 Home、真机连接、遥操作和采集配置。
mode: record
sim: false

cell:
  ur_type: ur10e
  robot_ip: 169.254.138.15
  gripper_port: /dev/ttyUSB0
  ftdi_id: ttyUSB2
  ft300_enabled: false           # false：保留模型与虚拟接口，不访问 FT300 串口。
  launch_rviz: true              # 仿真和真机 Home 均打开 RViz。

# home_node 仅使用 slave；值按 UR_JOINT_NAMES 顺序：
# shoulder_pan、shoulder_lift、elbow、wrist_1、wrist_2、wrist_3（单位 rad）。
home:
  slave: [1.537065029144287, -1.3990939271501084, 1.9127243200885218, -2.0777298412718714, -1.5744393507586878, -4.770853106175558]
  at_home_tolerance_rad: 0.1
  move_timeout_s: 60.0
  move_duration_s: 8.0
  verify_duration_s: 2.0

teleop:
  control_source: xbot
  controller: cartesian_impedance

xbot:
  device_id: 0
  calibration_file: /ros2_ws/src/ur_teleop/config/xbot_joy.yaml
  # 与控制器 spawner 的 --param-file 相同；切换仿真时改为 ur10e_xbot_sim_cartesian_impedance.yaml。
  controller_config_file: /ros2_ws/src/cartesian_impedance_controller/config/ur10e_ft300_cartesian_impedance.yaml
  control_hz: 50.0
  diagnostic_hz: 5.0
  joy_timeout_s: 0.25
  tcp_timeout_s: 0.25
  # 满量程速度；每周期增量 = 速度 / control_hz。
  max_linear_speed_m_s: 1.0
  max_angular_speed_rad_s: 5.0
  # 相对于接管阻抗控制器后首条 current_pose 的 XYZ 半范围。
  workspace_half_extent_m: [0.20, 0.20, 0.20]
  precision_scale: 0.25
  deadzone: 0.08
  left_stick_xy_free: false  # false：左摇杆主轴过滤；true：允许 XY 同时输出。
  view_hold_s: 0.5

gripper:
  enabled: false                 # 同时关闭夹爪控制栈与手柄 A 键命令。
  action_server: /robotiq_gripper_controller/gripper_cmd
  close_threshold_m: 0.0125
  open_threshold_m: 0.005
  open_pos_rad: 0.0
  close_pos_rad: 0.79
  max_effort: 50.0

recorder:
  repo_id: my_user/ur10e_xbot
  root: /ros2_ws/dataset/xbot
  fps: 20
  robot_type: ur10e_xbot_teleop
  action_space: cartesian_pose
  action_mode: abs  # abs：最终目标 xyz+xyzw；rel：最终目标相对同周期实测 TCP 的 xyz+旋转向量。
  record_action_joints: true
  record_action_gripper: false    # 夹爪关闭时不保存动作末维；位姿动作始终保存。
  record_joint_position: true
  record_joint_velocity: true
  record_joint_effort: true      # /joint_states.effort；UR 上可能表示电机电流，非实测关节力矩。
  record_tcp_pose: true
  record_ur_gripper: false
  record_wrench: true            # FT300 启用时取外部传感器，否则取 UR 内置传感器。
  data_timeout_s: 0.5
  ee_pose_source: tf
  ee_pose_parent_frame: base_link # Xbot 实际按控制器参考 link 自动选择；此项保留兼容 Alicia。
  ee_pose_child_frame: tool0     # observation 的 TCP link。
  use_videos: true
  cameras: {}                    # 仅定义数据集图像；发布与预览见 camera.yaml，示例见 docs/data_recorder.md。
  task: xbot_teleoperation
  min_frames_per_episode: 2
  state_threshold_rad: 0.4
