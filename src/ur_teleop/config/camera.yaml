# 顶层键为自定义相机名称；仅使用字母、数字和下划线，以字母开头。
# enabled 控制发布，visualize 控制是否加入预览。
# 默认彩色话题为 /camera/<相机名称>/color/image_raw，可用 topic 覆盖。
# USB 用 device 绑定物理端口；RealSense 用加引号的 serial_no 绑定设备。
# resize 仅控制保存图像的缩放，resize_width/resize_height 是保存尺寸。
# 遥操作配置的 recorder.cameras 只选择录制的相机名称。
usb_front:
  type: usb
  enabled: true
  visualize: true
  device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:6.2.1:1.0-video-index0
  width: 640
  height: 480
  fps: 30
  resize: false
  resize_width: 320
  resize_height: 240
  fourcc: MJPG
  publish_compressed: true
  compressed_quality: 90
usb_left:
  type: usb
  enabled: true
  visualize: true
  device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:6.2.2:1.0-video-index0
