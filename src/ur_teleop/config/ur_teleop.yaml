mode: teleop            # teleop | record —— 配置文件配置模式
sim: true               # cell 端：sim(mock+rviz) / real(真机+夹爪+FT)
cell:
  ur_type: ur10e
  robot_ip: 169.254.138.15
  gripper_port: /dev/ttyUSB0     # real 模式，include robotiq_control 用
  ftdi_id: "ttyUSB2"                    # real 模式，include rq_fts 驱动用（launch 参数即 ftdi_id）
  launch_rviz: true
  alicia_port: "/dev/ttyACM0"                 # 空=自动检测；可指定如 /dev/ttyACM0
  launch_alicia: true             # 主臂始终真实；纯 sim 无 Alicia 时设 false
# 相机发布由独立的 camera.launch.py 启动，不会随 UR 控制栈启动。
# 当前工作站默认使用三台 USB 相机；RealSense 保持关闭。
cameras:
  realsense:
    enabled: false
    d435i_serial: "405622073956"
    d455_serial: "311322304687"
    enable_d435i: true
    enable_color: true
    enable_depth: false
    color_profile: "640,480,30"
    camera_namespace: camera
  opencv:
    enabled: true
    # 每台 USB 相机的设备端口、节点名、图像话题和分辨率在此文件定义。
    config_file: ""
  visualization:
    # 合成单一拼接图像，再由 rqt_image_view 单窗口显示；支持缩放与平移。
    enabled: true
    topics:
      - /camera/usb_front/color/image_raw
      - /camera/usb_left/color/image_raw
      - /camera/usb_right/color/image_raw
home:
  master: [-0.0214676, -0.0781908, -0.1104793, 0.2501057, -0.0015708, -0.0445059]     # 目标 home（用户提前设置，本包不处理含义）
  slave:  [1.5078551769256592, -1.3925983321717759, 2.010801140462057, -2.1436053715147914, -1.54979116121401, 4.581111431121826]
  master_gripper_value: 1000
  at_home_tolerance_rad: 0.1   # 与控制器的 goal tolerance (0.1) 保持一致，避免控制器报告成功但 home_node 验证失败
  settle_time_s: 2.0
  settle_motion_threshold_rad: 0.01
  move_timeout_s: 60.0       # 含轨迹执行时间；0.2 rad/s 约束下 5 rad 位移约需 25 s
  move_duration_s: 8.0
  verify_duration_s: 2.0
mapping:
  alicia_joint_order: [Joint1, Joint2, Joint3, Joint4, Joint5, Joint6]
  ur_joint_order: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
  sign: [1, -1, -1, -1, -1, -1]
  scale: [0.8, 0.8, 0.8, 0.8, 0.8, 0.8]
safety:
  clamp_margin_rad: 0.1
  limits:
    shoulder_pan_joint: [-6.283, 6.283]
    shoulder_lift_joint: [-6.283, 6.283]
    elbow_joint: [-3.142, 3.142]
    wrist_1_joint: [-6.283, 6.283]
    wrist_2_joint: [-6.283, 6.283]
    wrist_3_joint: [-6.283, 6.283]
teleop:
  # forward_position：发布 Float64MultiArray 到 forward position controller。
  # joint_impedance：发布 JointState（含关节名）到 joint impedance controller。
  # 改为 joint_impedance 后，home.launch 会预加载阻抗控制器，遥操/数采启用时切换它。
  controller: joint_impedance
  command_rate_hz: 500
  watchdog_timeout_s: 0.5
  restore_controller_on_exit: true
ruckig:
  control_hz:       500.0                                       # launch ruckig_control_hz 默认值；与 controller_manager 一致
  max_velocity:     [2.0944, 2.0944, 3.1416, 3.1416, 3.1416, 3.1416]        # rad/s，每关节
  max_acceleration: [0.80, 0.80, 0.80, 0.80, 0.80, 0.80]        # rad/s^2
  max_jerk:         [4.0, 4.0, 4.0, 4.0, 4.0, 4.0]              # rad/s^3
gripper:
  enabled: true                  # 启用夹爪遥操作（sim + real）
  # sim: controller 由 cell.launch 额外 spawn 到 UR controller_manager
  # real: controller 由 robotiq_control.launch 的独立 robotiq_controller_manager 提供
  # 两种模式下 action server 都是根级命名 /robotiq_gripper_controller/gripper_cmd
  action_server: /robotiq_gripper_controller/gripper_cmd
  close_threshold_m: 0.0125
  open_threshold_m: 0.005
  open_pos_rad: 0.0
  close_pos_rad: 0.79
  max_effort: 50.0
recorder:
  repo_id: my_user/ur_teleop
  root: "/ros2_ws/dataset/testv1"                       # 空 = HF_LEROBOT_HOME
  fps: 60
  robot_type: ur10e_alicia_teleop
  use_videos: true
  ee_pose_source: tf             # tf | topic(/tcp_pose_broadcaster/pose) | none
  ee_pose_topic: /tcp_pose_broadcaster/pose
  ee_pose_parent_frame: base_link
  ee_pose_child_frame: tool0     # tool0 在 bare（real）与组合（sim）URDF 中都存在；
                                 # gripper_tcp 只在组合模型里，real 下查不到 → NaN
  cameras: {}                    # {"wrist": {topic, image_key, height, width}}
  task: teleoperation
  min_frames_per_episode: 2
  state_threshold_rad: 0.4       # robotiq 夹爪 rad → 0/1 state 阈值
