/**/cartesian_impedance_controller:
  ros__parameters:
    save_debug_log: false  # true：以 5 Hz 保存计算数据 CSV，路径见启动提示。
    # XBot 仿真使用组合 URDF 的 base_link → tool0 运动学链。
    type: cartesian_impedance_controller/CartesianImpedanceController
    tf_prefix: ""
    base_frame: base_link
    tip_frame: tool0
    target_topic: ~/target_pose
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

    # 仿真起步参数；真机参数见 ur10e_ft300_cartesian_impedance.yaml。
    stiffness: [60.0, 60.0, 60.0, 6.0, 6.0, 6.0]
    damping: [15.0, 15.0, 15.0, 1.5, 1.5, 1.5]
    # 每周期逐轴裁剪参与控制的位姿误差；前三轴为米，后三轴为弧度。
    max_pose_error: [0.02, 0.02, 0.02, 0.10, 0.10, 0.10]

    max_wrench: [40.0, 40.0, 40.0, 4.0, 4.0, 4.0]
    max_torque: [60.0, 60.0, 60.0, 30.0, 30.0, 30.0]
    reference_filter_alpha: 0.1
