controller_manager:
  ros__parameters:
    update_rate: 500
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_impedance_controller:
      type: joint_impedance_controller/JointImpedanceController

joint_impedance_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    stiffness: [80.0, 80.0, 60.0, 20.0, 15.0, 10.0]
    damping: [18.0, 18.0, 14.0, 5.0, 4.0, 3.0]
    max_torque: [40.0, 40.0, 30.0, 12.0, 10.0, 8.0]
    max_torque_rate: [100.0, 100.0, 80.0, 40.0, 30.0, 20.0]
    max_position_error: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
    joint_position_min: [-6.283, -6.283, -6.283, -6.283, -6.283, -6.283]
    joint_position_max: [6.283, 6.283, 6.283, 6.283, 6.283, 6.283]
    reference_speed: 0.2
    command_timeout: 0.5
