controller_manager:
  ros__parameters:
    robotiq_activation_controller:
      type: robotiq_controllers/RobotiqActivationController
    robotiq_gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController
    robotiq_force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

robotiq_activation_controller:
  ros__parameters:
    default: true

# Reuse the official Robotiq action controller.  It owns the position command
# interface and accepts open/close goals through ParallelGripperCommand.
robotiq_gripper_controller:
  ros__parameters:
    joint: robotiq_85_left_knuckle_joint
    state_interfaces: [position, velocity]
    allow_stalling: false
    goal_tolerance: 0.02

robotiq_force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: robotiq_ft_sensor
    state_interface_names:
      - force.x
      - force.y
      - force.z
      - torque.x
      - torque.y
      - torque.z
    frame_id: robotiq_ft_frame_id
    topic_name: ft300_wrench
