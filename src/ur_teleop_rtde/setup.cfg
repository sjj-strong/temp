# 固定 console_scripts 安装位置为 $base/lib/<pkg>/ —— ros2 run / ros2 pkg executables
# 只在该目录查找可执行文件；缺省时 setuptools 会装到 <prefix>/bin 导致
# "No executable found"（colcon-core ≥0.21 行为）。
# 必须带 $base：colcon 把这里的值原样透传给 --install-scripts，distutils 用
# subst_vars 把 $base 展开成 install_base（= colcon 前缀）。少了 $base 时，
# 相对路径会相对 CWD（源码目录）解析，脚本落进 src/<pkg>/lib/<pkg>/，
# install/<pkg>/lib/<pkg>/ 为空 → ros2 run 报 "No executable found"。
# - [develop]（--symlink-install 走 setup.py develop）→ script_dir
# - [install]（普通安装走 setup.py install）→ install_scripts（colcon 从
#   此处读取并显式传 --install-scripts；下划线形式避免 setuptools 警告）
[develop]
script_dir = $base/lib/ur_teleop_rtde

[install]
install_scripts = $base/lib/ur_teleop_rtde
